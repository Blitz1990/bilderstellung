[General]
# Choose your image generation provider here.
# Options: openai, stabilityai
provider = openai

[OpenAI]
# Style suffix for the OpenAI DALL-E 3 model.
style_suffix = , for a children's coloring book, simple, clean lines, black and white, vector illustration, no shading

[StabilityAI]
# Style suffix for Stability AI models.
# Note: Stability AI uses a different prompt structure.
# You might need to adjust this. For coloring books, you can add "coloring book page" to your main prompt.
# Negative prompts (what not to see) are also useful here, but not yet supported by this script.
style_suffix = , line art, black and white, coloring book style
